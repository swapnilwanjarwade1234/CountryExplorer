

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore countries, flags, capitals, populations, languages and currencies.">
  <title>Country Explorer</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="header">
    <a class="logo" href="./">🌍 Country Explorer</a>
    <button id="themeBtn" class="theme-btn" type="button">
      🌙 Dark Mode
    </button>
  </header>

  <main class="container">
    <section class="hero">
      <p class="eyebrow">EXPLORE OUR WORLD</p>
      <h1>Discover any country.</h1>
      <p class="subtitle">
        Explore flags, capitals, populations, languages and currencies.
      </p>

      <form id="searchForm" class="search-form">
        <label class="sr-only" for="countryInput">Country name</label>
        <input
          id="countryInput"
          type="search"
          placeholder="Try India, Japan, Canada..."
          minlength="2"
          required
        >
        <button type="submit">Search</button>
      </form>

      <p id="status" role="status" aria-live="polite">
        Enter a country name to get started.
      </p>
    </section>

    <section class="recent-section">
      <h2>Recent searches</h2>
      <div id="recentSearches" class="recent-list"></div>
    </section>

    <section>
      <div id="results" class="country-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    <p>Country Explorer · Built with HTML, CSS and JavaScript</p>
    <p>
      Country data:
      <a href="https://countries.dev/" target="_blank" rel="noopener noreferrer">
        countries.dev
      </a>
    </p>
  </footer>
</body>
</html>
